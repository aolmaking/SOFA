openapi: "3.0.3"
info:
  title: SOFA Order History API
  version: "1.0.0"

paths:
  /api/history:
    get:
      summary: List authenticated customer's completed order history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
          description: "Max orders to return"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Pagination offset"
      responses:
        '200':
          description: Customer's completed orders, newest first
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryOrder' }
        '401':
          description: Anonymous user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/history/{order_public_id}:
    get:
      summary: Get detailed breakdown of one past order
      security:
        - bearerAuth: []
      parameters:
        - name: order_public_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Single order with full item breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryOrder' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found or not owned by customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  schemas:
    HistoryOrder:
      type: object
      required: [order_id, status, total, created_at, updated_at, items, timeline]
      properties:
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [completed] }
        total: { type: number, format: float, example: 125.0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [name, price, quantity]
            properties:
              name: { type: string }
              price: { type: number, format: float }
              quantity: { type: integer, minimum: 1 }
        timeline:
          type: array
          items:
            type: object
            required: [status, timestamp]
            properties:
              status: { type: string, enum: [pending, preparing, ready, completed] }
              timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT