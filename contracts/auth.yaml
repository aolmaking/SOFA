openapi: "3.0.3"
info:
  title: SOFA Authentication API
  version: "1.0.0"

paths:
  /api/auth/register:
    post:
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, username, email, password]
              properties:
                full_name:
                  type: string
                  pattern: "^(?:[^\W\d_]||\s||'||-||\.){1,80}$"
                  description: "Customer full name, 1-80 chars, Unicode letters only"
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  description: "Unique login handle"
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: "Unique email address"
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: "^(?=.*[A-Za-z])(?=.*\d)[^\s]{8,128}$"
                  description: "8+ chars, 1 letter, 1 number, no spaces"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Registration successful" }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Duplicate email or username
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      summary: Authenticate and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
                remember_me: { type: boolean, default: false }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: "JWT access token" }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/logout:
    post:
      summary: Invalidate client token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Logout successful" }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/me:
    get:
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                required: [customer_public_id, email, username, full_name]
                properties:
                  customer_public_id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  username: { type: string }
                  full_name: { type: string }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: "Human-readable message" }
        code: { type: string, description: "Machine-readable error code" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT